server:
  address: 127.0.0.1
  port: 8090
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${wiki.db.host}:3306/uemwiki?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${wiki.db.username}
    password: ${wiki.db.pw}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  thymeleaf:
    cache: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
contrib:
  upload-dir: ${UPLOAD_DIR:./data/demo-private}
  export-dir: ${EXPORT_DIR:./export}
  admin-user: demo
  admin-password-hash: ${ADMIN_PASSWORD_HASH:$2a$10$4Iyg94581QO922tXUp6rT.H2ymyaWDlFhMcfSC7WXTeaqznN64mVO}
  github-token: ''
  github-repo: ''
  github-branch: main
  wiki-root: ../
